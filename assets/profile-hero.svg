<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Levent Aydin — Senior Full-Stack, Mobile &amp; AI Automation Engineer</title>
  <desc id="desc">Minimal engineering portfolio header with production systems, mobile, AI automation, integrations and infrastructure focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="460" rx="28" fill="url(#bg)"/>
  <circle cx="1370" cy="90" r="185" fill="#38bdf8" opacity="0.055"/>
  <circle cx="1470" cy="365" r="250" fill="#a78bfa" opacity="0.04"/>
  <path d="M980 82 C1160 10 1350 40 1538 150" fill="none" stroke="#38bdf8" stroke-opacity="0.13" stroke-width="2"/>
  <path d="M1020 360 C1210 270 1390 290 1560 390" fill="none" stroke="#34d399" stroke-opacity="0.12" stroke-width="2"/>

  <rect x="82" y="76" width="82" height="7" rx="3.5" fill="url(#accent)"/>
  <text x="190" y="88" fill="#94a3b8" font-size="23" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="7">ENGINEERING PORTFOLIO</text>

  <text x="82" y="205" fill="#f8fafc" font-size="78" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Levent Aydin</text>
  <text x="84" y="266" fill="#cbd5e1" font-size="36" font-weight="500" font-family="Inter,Segoe UI,Arial,sans-serif">Senior Full-Stack, Mobile &amp; AI Automation Engineer</text>

  <text x="84" y="326" fill="#94a3b8" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif">Production software · AI workflows · mobile systems · integrations · cloud infrastructure</text>

  <g transform="translate(84,366)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">
    <rect x="0" y="0" width="175" height="48" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="87.5" y="31" text-anchor="middle" fill="#bae6fd">FULL-STACK</text>
    <rect x="191" y="0" width="150" height="48" rx="24" fill="#0f172a" stroke="#34d399" stroke-opacity="0.55"/>
    <text x="266" y="31" text-anchor="middle" fill="#a7f3d0">MOBILE</text>
    <rect x="357" y="0" width="190" height="48" rx="24" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="452" y="31" text-anchor="middle" fill="#ddd6fe">AI AUTOMATION</text>
    <rect x="563" y="0" width="225" height="48" rx="24" fill="#0f172a" stroke="#64748b" stroke-opacity="0.7"/>
    <text x="675.5" y="31" text-anchor="middle" fill="#cbd5e1">PRODUCTION SYSTEMS</text>
  </g>

  <g transform="translate(1120,164)" opacity="0.82">
    <rect x="0" y="0" width="330" height="152" rx="22" fill="#0f172a" stroke="#334155"/>
    <circle cx="38" cy="38" r="7" fill="#34d399" filter="url(#glow)"/>
    <text x="60" y="45" fill="#e2e8f0" font-size="20" font-weight="600" font-family="Inter,Segoe UI,Arial,sans-serif">Open to GCC relocation</text>
    <text x="38" y="88" fill="#94a3b8" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">Riyadh · Dubai / Abu Dhabi · Doha</text>
    <path d="M38 118 H286" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
